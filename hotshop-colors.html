<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141619">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kiln Workbook">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hot Shop Glass Color Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#141619; --raised:#1d2025; --raised-2:#22262c;
    --hairline:#2c3037; --hairline-bright:#3a4049;
    --ink:#e8e6e1; --ink-dim:#8b9099; --ink-faint:#5f656d;
    --amber:#ffb040; --amber-fill:rgba(255,176,64,0.09); --amber-line:rgba(255,176,64,0.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--void);color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;padding:44px 22px 60px}
  .wrap{max-width:1040px;margin:0 auto}
  .crumb{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-dim);
    text-decoration:none;margin-bottom:14px;transition:color .15s}
  .crumb:hover{color:var(--amber)}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:18px;padding-bottom:16px;border-bottom:1px solid var(--hairline);margin-bottom:6px}
  .title-block h1{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1.05}
  .title-block .eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
  .title-block .sub{color:var(--ink-dim);font-size:13.5px;margin-top:5px;max-width:64ch}
  @media print{.crumb{display:none}}
</style>
<link rel="stylesheet" href="colors/color-search.css">
</head>
<body>
<div class="wrap">

  <a href="index.html" class="crumb">&lsaquo; Index</a>

  <header>
    <div class="title-block">
      <p class="eyebrow">Kiln Forming Workbook &middot; Molds &amp; glass</p>
      <h1>Hot Shop Glass Color Search</h1>
      <p class="sub">Kugler, Reichenbach, Gaffer and Oceanside blowing colors. Search by name, number or German name.</p>
    </div>
  </header>

  <div id="hotshop-search"></div>

</div>
<script src="colors/color-search.js"></script>
<script>
  ColorSearch.mount('#hotshop-search', { data: 'colors/hotshop-colors.json', mode: 'hotshop' });
</script>
</body>
</html>
