<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="heat" x1="92" y1="386" x2="420" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b7089"/>
      <stop offset="0.30" stop-color="#b23a2e"/>
      <stop offset="0.55" stop-color="#e8621f"/>
      <stop offset="0.80" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#141619"/>
  <!-- faint baseline -->
  <line x1="92" y1="410" x2="420" y2="410" stroke="#2c3037" stroke-width="6" stroke-linecap="round"/>
  <!-- soak glow -->
  <circle cx="408" cy="138" r="70" fill="url(#glow)"/>
  <!-- firing ramp: cold baseline -> ramp -> hold -> ramp -> peak soak -->
  <path d="M 92 386 L 168 386 L 250 250 L 322 250 L 396 138 L 420 138"
