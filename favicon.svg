        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- white-hot soak point -->
  <circle cx="408" cy="138" r="17" fill="#ffd76a"/>
  <circle cx="408" cy="138" r="7" fill="#fff8e6"/>
</svg>